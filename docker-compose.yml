services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crowdfunding
      POSTGRES_USER: crowdfunding
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-this-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowdfunding -d crowdfunding"]
      interval: 5s
      timeout: 3s
      retries: 10
  campaign-service:
    build: ./campaign-service
    environment:
      PORT: 8001
      DATABASE_URL: postgres://crowdfunding:${DB_PASSWORD:-change-this-password}@db:5432/crowdfunding?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-change-this-webhook-secret}
      NOTIF_URL: http://notification-service:8002
    depends_on:
      db: { condition: service_healthy }
  campaign-service-2:
    build: ./campaign-service
    restart: unless-stopped
    environment:
      PORT: 8001
      DATABASE_URL: postgres://crowdfunding:${DB_PASSWORD:-change-this-password}@db:5432/crowdfunding?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-change-this-webhook-secret}
      NOTIF_URL: http://notification-service:8002
    depends_on:
      db: { condition: service_healthy }
  notification-service:
    build: ./notification-service
    restart: unless-stopped
    environment:
      PORT: "8443"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:?Set OAUTH_CLIENT_ID in .env}
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:?Set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/"
      MTLS_ENABLED: "true"
      TLS_CA_FILE: /certs/ca.crt
      TLS_CERT_FILE: /certs/notification.crt
      TLS_KEY_FILE: /certs/notification.key
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/notification.crt:/certs/notification.crt:ro
      - ./certs/notification.key:/certs/notification.key:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks: [crowdfunding]

  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      PORT: "8000"
      CAMPAIGN_SERVICES: https://campaign-service:8443,https://campaign-service-2:8443
      NOTIFICATION_SERVICE: https://notification-service:8443
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:?Set OAUTH_CLIENT_ID in .env}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?Set OAUTH_CLIENT_SECRET in .env}
      MTLS_ENABLED: "true"
      TLS_CA_FILE: /certs/ca.crt
      TLS_CERT_FILE: /certs/gateway.crt
      TLS_KEY_FILE: /certs/gateway.key
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/gateway.crt:/certs/gateway.crt:ro
      - ./certs/gateway.key:/certs/gateway.key:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      campaign-service:
        condition: service_healthy
      campaign-service-2:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [crowdfunding]

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [gateway]
volumes:
  pgdata:
