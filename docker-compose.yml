services:
  campaign-service:
    build: ./campaign-service
    environment:
      PORT: 8001
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env to your Neon connection string}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      PAYMENT_WEBHOOK_SECRET: "${PAYMENT_WEBHOOK_SECRET:?Set PAYMENT_WEBHOOK_SECRET in .env}"
      NOTIF_URL: http://notification-service:8002
  campaign-service-2:
    build: ./campaign-service
    environment:
      PORT: 8001
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env to your Neon connection string}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      PAYMENT_WEBHOOK_SECRET: "${PAYMENT_WEBHOOK_SECRET:?Set PAYMENT_WEBHOOK_SECRET in .env}"
      NOTIF_URL: http://notification-service:8002
  notification-service:
    build: ./notification-service
    environment: { PORT: 8002 }
  gateway:
    build: ./gateway
    environment:
      PORT: 8000
      CAMPAIGN_SERVICES: http://campaign-service:8001,http://campaign-service-2:8001
      NOTIFICATION_SERVICE: http://notification-service:8002
    ports: ["8000:8000"]
    depends_on: [campaign-service, campaign-service-2, notification-service]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [gateway]
